[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scce-light"
version = "1.0"
description = "Lightweight SC-CE: selective classification via counterfactual explanations"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Valerio Bonsignori"}]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9.3",
    "pandas>=1.5",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
demo = ["matplotlib", "jupyter"]
test = ["pytest"]

[tool.setuptools]
packages = ["scce_light"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
